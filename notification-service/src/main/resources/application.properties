# Server Configuration
server.port=8081
spring.application.name=notification-service

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# SMTP Configuration (MailHog)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Configuration
app.mq.exchange=auth.events
app.mq.queue.userRegistered=notification.user-registered
app.mq.rk.userRegistered=auth.user-registered
app.mq.dlq.exchange=auth.events.dlq
app.mq.dlq.queue=notification.user-registered.dlq
app.mail.from=noreply@microservices.com
app.verification.url=http://localhost:8080/api/auth/verify

# Logging
logging.level.com.microservices.notification=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.mail=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
