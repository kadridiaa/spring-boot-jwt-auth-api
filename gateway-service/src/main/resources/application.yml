spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1

        - id: feed-service
          uri: ${FEED_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/feed-service/**
          filters:
            - StripPrefix=1

        - id: service-a
          uri: ${SERVICE_A_URI:http://localhost:8083}
          predicates:
            - Path=/service-a/**
          filters:
            - StripPrefix=1

        - id: service-b
          uri: ${SERVICE_B_URI:http://localhost:8084}
          predicates:
            - Path=/service-b/**
          filters:
            - StripPrefix=1

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:5500"
              - "http://127.0.0.1:5500"
              - "null"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers: "*"
            exposed-headers: "*"
            allow-credentials: true
            max-age: 3600