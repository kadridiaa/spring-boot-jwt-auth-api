# Configuration de l'application
spring.application.name=Spring Auth App

# Configuration du serveur
server.port=8080

# Configuration H2 (désactivé)
#spring.datasource.url=jdbc:h2:mem:authdb
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/authdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuration JWT (512 bits minimum pour HS512)
jwt.secret=VotreCleSecreteTresTresLongueEtSecurisee123456789AbCdEfGh0123456789IjKlMnOpQrStUvWxYz
jwt.expiration=86400000

# Logs
logging.level.com.auth=DEBUG
logging.level.org.springframework.security=DEBUG
