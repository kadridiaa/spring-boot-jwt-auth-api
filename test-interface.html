<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Auth - Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #48c6ef 0%, #6f86d6 100%);
            margin-top: 10px;
        }
        
        .btn-admin {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-public {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        #response {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #response h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        #output {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .token-display {
            background: #fffbea;
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            word-wrap: break-word;
        }
        
        .token-display strong {
            color: #d97706;
        }
        
        .success {
            color: #10b981;
            font-weight: bold;
        }
        
        .error {
            color: #ef4444;
            font-weight: bold;
        }
        
        .info {
            background: #e0f2fe;
            border-left: 4px solid #0284c7;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test API Authentication</h1>
        
        <div class="info">
            <strong>URL de l'API :</strong> http://localhost:8080
        </div>
        
        <div class="cards">
            <!-- Inscription -->
            <div class="card">
                <h2>📝 Inscription</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="regUsername" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="regPassword" required>
                    </div>
                    <button type="submit">S'inscrire</button>
                </form>
            </div>
            
            <!-- Connexion -->
            <div class="card">
                <h2>🔑 Connexion</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="loginUsername" value="user" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="loginPassword" value="password123" required>
                    </div>
                    <button type="submit">Se connecter</button>
                    <button type="button" class="btn-admin" onclick="loginAdmin()">Se connecter (Admin)</button>
                </form>
            </div>
            
            <!-- Tests routes protégées -->
            <div class="card">
                <h2>🛡️ Routes Protégées</h2>
                <button onclick="getProfile()">Mon Profil</button>
                <button class="btn-secondary" onclick="testUser()">Test Route USER</button>
                <button class="btn-admin" onclick="testAdmin()">Test Route ADMIN</button>
                <button class="btn-public" onclick="testPublic()">Test Route Publique</button>
            </div>
        </div>
        
        <!-- Token actuel -->
        <div class="card" id="tokenCard" style="display:none;">
            <h2>🎫 Token JWT</h2>
            <div class="token-display">
                <strong>Token actuel :</strong><br>
                <span id="currentToken"></span>
            </div>
        </div>
        
        <!-- Réponses -->
        <div id="response">
            <h2>📡 Réponse du serveur</h2>
            <div id="output">En attente de requête...</div>
        </div>
    </div>

    <script>
        let token = null;
        const API_URL = 'http://localhost:8080';
        
        // Afficher la réponse
        function displayResponse(data, status, url) {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            
            let statusClass = status >= 200 && status < 300 ? 'success' : 'error';
            
            output.innerHTML = `
<span class="${statusClass}">[${timestamp}] ${status} - ${url}</span>

${JSON.stringify(data, null, 2)}
            `;
            
            // Si un token est reçu, le sauvegarder
            if (data.token) {
                token = data.token;
                document.getElementById('currentToken').textContent = token;
                document.getElementById('tokenCard').style.display = 'block';
            }
        }
        
        // Inscription
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                username: document.getElementById('regUsername').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            };
            
            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                displayResponse(result, response.status, '/api/auth/register');
            } catch (error) {
                displayResponse({ error: error.message }, 500, '/api/auth/register');
            }
        });
        
        // Connexion
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                username: document.getElementById('loginUsername').value,
                password: document.getElementById('loginPassword').value
            };
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                displayResponse(result, response.status, '/api/auth/login');
            } catch (error) {
                displayResponse({ error: error.message }, 500, '/api/auth/login');
            }
        });
        
        // Connexion admin
        async function loginAdmin() {
            const data = {
                username: 'admin',
                password: 'admin123'
            };
            
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                displayResponse(result, response.status, '/api/auth/login (ADMIN)');
            } catch (error) {
                displayResponse({ error: error.message }, 500, '/api/auth/login');
            }
        }
        
        // Profil
        async function getProfile() {
            if (!token) {
                displayResponse({ error: 'Vous devez vous connecter d\'abord !' }, 401, '/api/auth/profile');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/profile`, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                displayResponse(result, response.status, '/api/auth/profile');
            } catch (error) {
                displayResponse({ error: error.message }, 500, '/api/auth/profile');
            }
        }
        
        // Test route USER
        async function testUser() {
            if (!token) {
                displayResponse({ error: 'Vous devez vous connecter d\'abord !' }, 401, '/api/auth/user/test');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/user/test`, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                displayResponse(result, response.status, '/api/auth/user/test');
            } catch (error) {
                displayResponse({ error: error.message }, 500, '/api/auth/user/test');
            }
        }
        
        // Test route ADMIN
        async function testAdmin() {
            if (!token) {
                displayResponse({ error: 'Vous devez vous connecter d\'abord !' }, 401, '/api/auth/admin/test');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/auth/admin/test`, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                displayResponse(result, response.status, '/api/auth/admin/test');
            } catch (error) {
                displayResponse({ error: error.message }, 500, '/api/auth/admin/test');
            }
        }
        
        // Test route publique
        async function testPublic() {
            try {
                const response = await fetch(`${API_URL}/api/public/test`, {
                    method: 'GET'
                });
                
                const result = await response.text();
                displayResponse({ message: result }, response.status, '/api/public/test');
            } catch (error) {
                displayResponse({ error: error.message }, 500, '/api/public/test');
            }
        }
    </script>
</body>
</html>
